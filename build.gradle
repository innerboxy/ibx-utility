// IBX-Utility（ibx_utility）：酒馆轶事的功能方块（装备锻造台、战利品袋、制箭台），独立模组。
// 2026-10-09 之前是 taverntales 主仓库的子模组（共用那边的 gradle/mod-common.gradle），现在改回独立项目，
// 主模组从 Modrinth 加载已发布的版本。打包：gradlew build；开发客户端：gradlew runClient。
plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    // Modrinth 社区惯例：文件名带上加载器与 MC 版本，产物为 <jar_name>-neoforge-<mc>-<mod_version>.jar
    archivesName = "${jar_name}-neoforge-${minecraft_version}"
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude(".cache/**")    // datagen cache files
}

repositories {
    mavenCentral()
    maven {
        name = "BlameJared" // JEI
        url = "https://maven.blamejared.com/"
        content { includeGroup "mezz.jei" }
    }
    maven {
        name = "Modrinth" // BeyondDimensions, JER
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

// Mojang ships Java 25 to end users in 26.1, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    accessTransformers {
        from 'src/main/resources/META-INF/accesstransformer.cfg'
    }

    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime': present for runtime testing, but not pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // pinyin4j：锻造台界面的拼音搜索，打包进 jar
    implementation "com.belerweb:pinyin4j:${pinyin4j_version}"
    jarJar "com.belerweb:pinyin4j:${pinyin4j_version}"

    // JEI (optional)：编译只用 API，运行加载完整模组
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // BeyondDimensions (optional)：运行时通过 ModList 探测，没装时联动代码不加载
    compileOnly "maven.modrinth:beyonddimensions:${beyonddimensions_version}"

    // Just Enough Resources (optional)：在 JEI 里展示战利品袋掉落。JER 没有单独的 api 构件，整个模组 compileOnly
    compileOnly "maven.modrinth:just-enough-resources-jer:${jer_version}"
    runtimeOnly "maven.modrinth:just-enough-resources-jer:${jer_version}"
}

// Expands ${} properties in src/main/templates (META-INF/neoforge.mods.toml).
// A missing property will result in an error.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    filteringCharset = 'UTF-8'
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
