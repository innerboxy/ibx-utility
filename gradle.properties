# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# IBX-Utility（酒馆轶事的功能方块：装备锻造台、战利品袋、制箭台），独立模组。2026-10-09 从 taverntales 主仓库的子模组改回独立项目，
# 主模组 taverntales 从 Modrinth（https://modrinth.com/mod/taverntales-4ging）加载已发布的版本。

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.1.2
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[26.1.2,26.2)
neo_version=26.1.2.112
loader_version_range=[1,)

## Dependency Properties
# 拼音搜索，打包进 jar
pinyin4j_version=2.5.1
jei_version=29.37.0.100
beyonddimensions_version=0.7.30-26.1.2-neoforge
# JER 没有版本号形式的构件，这是 Modrinth 版本 id
jer_version=tBAdXL1H

## Mod Properties
mod_id=ibx_utility
mod_name=IBX-Utility
mod_license=MIT
mod_version=1.4.0
mod_group_id=ibx.utility
# jar 文件名前缀：<jar_name>-neoforge-<minecraft_version>-<mod_version>.jar
jar_name=ibx_utility
